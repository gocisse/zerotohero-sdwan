# Section 3, lesson 5: the jitter buffer. Facts: reference/dmpo-remediation.md (7 ms voice, 5 ms video, 10 packets or 200 ms). Timing is illustrative.
id: dmpo-jitter-buffer
title: The jitter buffer smoothing a stream (illustrative timing)
alt: >-
  Voice packets leave the branch Edge evenly spaced but arrive at the hub Edge unevenly because of jitter on the path. The hub
  Edge's jitter buffer holds packets briefly, up to 10 packets or 200 ms, and releases them evenly to the voice server.
width: 900
height: 460

nodes:
  - { id: phone, label: IP phone, kind: host, x: 60, y: 230 }
  - { id: edge-a, label: Branch Edge, kind: vce, x: 230, y: 230 }
  - { id: edge-b, label: Hub Edge, kind: vce, x: 680, y: 230, sublabel: jitter buffer }
  - { id: pbx, label: Voice server, kind: host, x: 840, y: 230 }

links:
  - { id: lan-a, from: phone, to: edge-a, style: lan }
  - { id: lan-b, from: edge-b, to: pbx, style: lan }
  - { id: path, from: edge-a, to: edge-b, style: underlay-internet, label: Internet path }

steps:
  - title: Evenly spaced going in
    narration: >-
      Voice is a steady stream: packets leave the sender at regular intervals. The picture is **illustrative**; the spacing is only for show.
    highlight: [phone, lan-a, edge-a]
    packets:
      - { path: [phone, lan-a, edge-a], label: "1", color_style: overlay-tunnel }
      - { path: [phone, lan-a, edge-a], label: "2", color_style: overlay-tunnel, delay_ms: 500 }
      - { path: [phone, lan-a, edge-a], label: "3", color_style: overlay-tunnel, delay_ms: 1000 }

  - title: Uneven coming out of the path
    narration: >-
      **Jitter** is variation in delay. Some packets cross the path quickly, others slowly, so they arrive bunched and gapped. Played as they arrive, voice would
      sound choppy.
    highlight: [edge-a, path, edge-b]
    packets:
      - { path: [edge-a, path, edge-b], label: "1", color_style: overlay-tunnel }
      - { path: [edge-a, path, edge-b], label: "2", color_style: overlay-tunnel, delay_ms: 150 }
      - { path: [edge-a, path, edge-b], label: "3", color_style: overlay-tunnel, delay_ms: 1300 }
    callouts:
      - { target: path, text: "Bunched, then a gap: jitter." }

  - title: The buffer holds them
    narration: >-
      DMPO switches the jitter buffer on for real-time traffic when jitter is high: above 7 ms for voice, above 5 ms for video. The receiving endpoint holds up
      to **10 packets or 200 ms**. If the flow is not constant, the buffer is off.
    highlight: [edge-b]
    callouts:
      - { target: edge-b, text: "Buffer: up to 10 packets or 200 ms. On above 7 ms jitter (voice) or 5 ms (video)." }

  - title: Released evenly
    narration: >-
      The buffer lets packets out at an even pace. The cost is a small, bounded delay; the gain is a smooth stream for the listener.
    highlight: [edge-b, lan-b, pbx]
    packets:
      - { path: [edge-b, lan-b, pbx], label: "1", color_style: overlay-tunnel }
      - { path: [edge-b, lan-b, pbx], label: "2", color_style: overlay-tunnel, delay_ms: 500 }
      - { path: [edge-b, lan-b, pbx], label: "3", color_style: overlay-tunnel, delay_ms: 1000 }
