# PLACEHOLDER diagram used only to exercise the diagram engine.
# It makes NO claims about real VeloCloud behavior; every label is generic.
id: sample-branch-hub
title: "PLACEHOLDER: two branches and a hub"
alt: >-
  A placeholder diagram. Two branch sites on the left, each with a host and an edge device, connect across an
  internet cloud and an MPLS cloud to a hub site on the right that has an edge device, a firewall and a server
  rack. A controller sits in the middle. Nothing here describes real product behavior.
width: 900
height: 520

groups:
  - { id: site-a, label: "Site A (placeholder)", nodes: [host-a, edge-a] }
  - { id: site-b, label: "Site B (placeholder)", nodes: [host-b, edge-b] }
  - { id: hub, label: "Hub (placeholder)", nodes: [hub-edge, hub-fw, hub-dc] }

nodes:
  - { id: host-a, label: Host A, kind: host, x: 70, y: 110, sublabel: PLACEHOLDER }
  - { id: edge-a, label: Edge A, kind: vce, x: 210, y: 110, sublabel: PLACEHOLDER }
  - { id: host-b, label: Host B, kind: host, x: 70, y: 410, sublabel: PLACEHOLDER }
  - { id: edge-b, label: Edge B, kind: vce, x: 210, y: 410, sublabel: PLACEHOLDER }
  - { id: net, label: Internet cloud, kind: internet, x: 450, y: 90, sublabel: PLACEHOLDER }
  - { id: mpls, label: MPLS cloud, kind: mpls, x: 450, y: 420, sublabel: PLACEHOLDER }
  - { id: ctrl, label: Controller, kind: vco, x: 450, y: 260, sublabel: PLACEHOLDER }
  - { id: hub-edge, label: Hub edge, kind: vce, x: 650, y: 260, sublabel: PLACEHOLDER }
  - { id: hub-fw, label: Hub firewall, kind: firewall, x: 790, y: 150, sublabel: PLACEHOLDER }
  - { id: hub-dc, label: Hub servers, kind: datacenter, x: 790, y: 380, sublabel: PLACEHOLDER }

links:
  - { id: lan-a, from: host-a, to: edge-a, style: lan }
  - { id: lan-b, from: host-b, to: edge-b, style: lan }
  - { id: lan-hub-fw, from: hub-edge, to: hub-fw, style: lan }
  - { id: lan-hub-dc, from: hub-edge, to: hub-dc, style: lan }
  - { id: wan-a-net, from: edge-a, to: net, style: underlay-internet, label: internet }
  - { id: wan-net-hub, from: net, to: hub-edge, style: underlay-internet }
  - { id: wan-b-mpls, from: edge-b, to: mpls, style: underlay-mpls, label: mpls }
  - { id: wan-mpls-hub, from: mpls, to: hub-edge, style: underlay-mpls }
  - { id: wan-b-lte, from: edge-b, to: net, style: underlay-lte, label: lte, curve: -40 }
  - { id: tun-a-hub, from: edge-a, to: hub-edge, style: overlay-tunnel, label: tunnel }
  - { id: sec-b-hub, from: edge-b, to: hub-edge, style: ipsec, label: secure, curve: 20 }
  - { id: ctl-a, from: ctrl, to: edge-a, style: control }
  - { id: ctl-b, from: ctrl, to: edge-b, style: control }
  - { id: ctl-hub, from: ctrl, to: hub-edge, style: control }

steps:
  - title: Site A and the hub
    narration: >-
      This is a **placeholder** topology. Site A, at the top left, can reach the hub on the right through the
      internet cloud. Nothing else is drawn yet.
    highlight: [host-a, edge-a, lan-a, wan-a-net, net, wan-net-hub, hub-edge, lan-hub-dc, hub-dc]
    show: []
    callouts:
      - { target: net, text: A generic cloud. No real behavior is implied. }

  - title: A packet leaves Site A
    narration: >-
      A packet leaves the host at site A, passes the edge, crosses the internet cloud, and arrives at a server at
      the hub. This is a generic walk through the picture.
    highlight: [host-a, lan-a, edge-a, wan-a-net, net, wan-net-hub, hub-edge, lan-hub-dc, hub-dc]
    packets:
      - { path: [host-a, edge-a, net, hub-edge, hub-dc], label: pkt 1, color_style: underlay-internet }

  - title: A second site joins
    narration: >-
      A second site appears at the bottom left. It has its own host and edge, and several different kinds of
      links reach towards the clouds. The line styles tell the link kinds apart (see the legend).
    show: [host-b, edge-b, mpls, lan-b, wan-b-mpls, wan-mpls-hub, wan-b-lte]
    highlight: [host-b, edge-b, lan-b, wan-b-mpls, mpls, wan-mpls-hub, wan-b-lte]

  - title: A packet leaves Site B
    narration: >-
      A packet from site B travels towards the same server at the hub, this time through the MPLS cloud.
    highlight: [host-b, lan-b, edge-b, wan-b-mpls, mpls, wan-mpls-hub, hub-edge, lan-hub-dc, hub-dc]
    packets:
      - { path: [host-b, edge-b, mpls, hub-edge, hub-dc], label: pkt 2, color_style: underlay-mpls, delay_ms: 300 }

  - title: A controller appears
    narration: >-
      A controller shows up in the middle, joined to each edge by thin dotted lines. These lines are just another
      link style in this placeholder.
    show: [ctrl, ctl-a, ctl-b, ctl-hub]
    highlight: [ctrl, ctl-a, ctl-b, ctl-hub]
    callouts:
      - { target: ctrl, text: Placeholder controller. }

  - title: More kinds of links
    narration: >-
      Two more link styles are drawn between the edges. Their only purpose is to demonstrate the style legend and
      progressive reveal.
    show: [tun-a-hub, sec-b-hub]
    highlight: [tun-a-hub, sec-b-hub, edge-a, edge-b, hub-edge]
    callouts:
      - { target: hub-edge, text: Both extra links end at the hub edge. }
