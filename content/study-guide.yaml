# The learner's six-section study guide (navigation labels only) and what the course offers for each topic.
# Format and rules: content/README.md ("Study guide"). Validated with the rest of the content.
#
# coverage: full    a lesson really teaches the topic (at least one lesson)
#           partial a lesson teaches part of it, or only the concept and where it lives in the VCO (at least one lesson)
#           none    nothing in the course teaches it (no lesson)
# The guide's own text is not available to the course author. Step 17 re-checked the G3 "Part N" topics against the lecture
# descriptions of the course outline (a third-party source, used only to decide what each topic is about, never as a technical
# fact); the notes say what is and is not covered. Config topics are "partial" at best: the course explains the concept and where it lives in the
# VCO but has no step-by-step settings walkthrough.

beyond:
  title: Beyond the study guide
  reason: "Terms the course teaches that the study guide has no topic for, mostly the routing vocabulary of Section 6 (static routes, OSPF, BGP, redistribution, route preference, Overlay Flow Control)."

# Lessons that no topic teaches on purpose.
unmapped_lessons:
  - ov-glance
  - ov-diagnosis
  - rt-big-picture
  - rt-static
  - rt-ospf
  - rt-bgp
  - rt-redistribution
  - rt-filters
  - rt-ofc
  - rt-diagnosis

sections:
  - id: G1
    title: Arista VeloCloud SD-WAN
    topics:
      - id: why-traditional-wan
        title: Why Traditional WAN Architectures Are No Longer Enough
        kind: concept
        coverage: full
        note: "A whole lesson on how a hub-and-spoke MPLS WAN works, what it does well, and why backhauling and cloud applications made it painful."
        lessons: [intro-why-wans-fall-short]
        quiz_topics: [wan-limits]
        diagrams: [wan-mpls-backhaul, wan-direct-internet]
        labs: []
        sim_screens: []
      - id: business-challenges
        title: Business Challenges That Drive the Need for SD-WAN
        kind: concept
        coverage: full
        note: "A whole lesson on cost, agility, visibility, branch rollout and transport choice, and what SD-WAN means."
        lessons: [intro-problems-sdwan-solves]
        quiz_topics: [sdwan-benefits]
        diagrams: []
        labs: []
        sim_screens: []
      - id: how-velocloud-solves
        title: How VeloCloud SD-WAN Solves the Problem
        kind: concept
        coverage: full
        note: "A whole lesson on the three components, overlay and underlay, transport independence, policy-based control and the three planes."
        lessons: [intro-how-velocloud-solves]
        quiz_topics: [velocloud-components, overlay-and-tunnels]
        diagrams: [vc-components]
        labs: []
        sim_screens: []
      - id: journey
        title: Journey of VeloCloud SD-WAN
        kind: concept
        coverage: full
        note: "A whole lesson on the VeloCloud, VMware, Broadcom, Arista path and why names differ between documents and screens; some history details are unconfirmed and hedged in the lesson."
        lessons: [intro-history-and-naming]
        quiz_topics: [history-naming]
        diagrams: []
        labs: []
        sim_screens: []

  - id: G2
    title: Arista VeloCloud SD-WAN Architecture
    topics:
      - id: vce
        title: VeloCloud Edge (VCE)
        kind: concept
        coverage: full
        note: "A whole lesson on what the Edge does between the LAN and the transports, what it builds, how it is provisioned and activated, and whose configuration is whose."
        lessons: [arch-edge]
        quiz_topics: [edge-role]
        diagrams: [arch-edge-between]
        labs: []
        sim_screens: [edges]
      - id: vco
        title: VeloCloud Orchestrator (VCO)
        kind: concept
        coverage: full
        note: "A whole lesson on what the Orchestrator manages and stores, plus an orientation tour of its main areas; what happens when it is lost is only partly documented and is hedged."
        lessons: [arch-orchestrator, intro-vco-orientation]
        quiz_topics: [orchestrator-role, vco-orientation]
        diagrams: []
        labs: []
        sim_screens: []
      - id: vcg
        title: VeloCloud Gateway (VCG)
        kind: concept
        coverage: full
        note: "A whole lesson on the Gateway's control-plane and optional data-plane roles, Gateway roles, Partner Gateways and placement; Gateway route reflection is described only as far as the documentation goes."
        lessons: [arch-gateway]
        quiz_topics: [gateway-role]
        diagrams: [arch-gateway-roles, arch-first-packet-gateway]
        labs: []
        sim_screens: [map]
      - id: underlay-overlay
        title: Underlay and Overlay
        kind: concept
        coverage: full
        note: "A whole lesson on raw transports versus the tunnels built on them and what transport independence means in practice."
        lessons: [arch-underlay-overlay]
        quiz_topics: [underlay-overlay]
        diagrams: [arch-underlay-overlay]
        labs: []
        sim_screens: [map]
      - id: tunnel-architecture
        title: Tunnel Architecture
        kind: concept
        coverage: full
        note: "A whole lesson on which tunnels form between which components, plus lessons on Cloud VPN and on dynamic branch-to-branch tunnels; some NAT and Hub port details are unconfirmed and hedged."
        lessons: [arch-tunnels, ov-cloud-vpn, ov-dynamic]
        quiz_topics: [tunnel-architecture, overlay-cloud-vpn, overlay-dynamic]
        diagrams: [arch-branch-to-hub, arch-dynamic-direct, ov-cloud-vpn-gateway, ov-dynamic-b2b]
        labs: [no-direct-tunnel]
        sim_screens: [map, paths, timeline]
      - id: ports-protocols
        title: Ports and Protocols
        kind: concept
        coverage: full
        note: "A whole lesson with a per-flow table of what must be allowed for an Edge to reach the Orchestrator, a Gateway and other Edges; unconfirmed items are marked."
        lessons: [arch-ports-firewall]
        quiz_topics: [firewall-ports]
        diagrams: [arch-firewall-flows]
        labs: []
        sim_screens: []
      - id: dmpo-1
        title: Dynamic Multipath Optimization (DMPO) Part 1
        kind: concept
        coverage: full
        note: "Lessons on the problem DMPO solves, flow-based versus packet-based handling, and what DMPO measures; the guide's own split into parts is unknown, so this part is mapped by theme."
        lessons: [dmpo-overview, dmpo-monitoring]
        quiz_topics: [dmpo-overview, dmpo-monitoring]
        diagrams: [dmpo-probes]
        labs: []
        sim_screens: [monitor]
      - id: dmpo-2
        title: Dynamic Multipath Optimization (DMPO) Part 2
        kind: concept
        coverage: full
        note: "Lessons on outages versus brownouts and the three on-demand remediation mechanisms (FEC, jitter buffer, NACK) with worked scenarios; mapped by theme because the guide's own split into parts is unknown."
        lessons: [dmpo-outage-brownout, dmpo-remediation, dmpo-together]
        quiz_topics: [dmpo-outage-brownout, dmpo-remediation, dmpo-scenarios]
        diagrams: [dmpo-outage-failover, dmpo-brownout-fec, dmpo-jitter-buffer, dmpo-nack]
        labs: []
        sim_screens: [timeline]
      - id: dmpo-3-link-steering
        title: "Dynamic Multipath Optimization (DMPO) Part 3: Link Steering"
        kind: concept
        coverage: full
        note: "A whole lesson on the four steering modes and the Mandatory, Preferred and Available axis, plus a guided diagnosis in the VCO; how an active remediation is shown in the VCO is not confirmed."
        lessons: [dmpo-steering, dmpo-vco-diagnosis]
        quiz_topics: [dmpo-steering, dmpo-vco-diagnosis]
        diagrams: [dmpo-steering-modes]
        labs: [video-wrong-link]
        sim_screens: [paths, trace]
      - id: vcmp-overhead-mtu
        title: VCMP, Tunnel Overhead and MTU
        kind: concept
        coverage: full
        note: "A whole lesson on where the bytes go, the verified overhead numbers for Internet Multipath and VPN traffic and a worked MTU calculation; VCMP itself is covered as the tunnel protocol on UDP 2426, not as a separate lesson."
        lessons: [arch-mtu-overhead]
        quiz_topics: [mtu-overhead]
        diagrams: []
        labs: [mtu-ipsec]
        sim_screens: [trace, paths]

