        coverage: partial
        note: "Walked from documented rows: creating, duplicating, modifying and deleting a Profile, the VLAN, interface, ARP, Wi-Fi, Global IPv6, LAN-side NAT, Telemetry and Edge Services settings, VPN settings (Section 8) and the Profile firewall settings and Edge Access; not covered as walkthroughs: the BGP, OSPF, BFD, ECMP, Overlay Route Control and Multicast fields (only in the routing lessons), Management IP, DSL and GPON, the Copy Profile dialog fields and what a Profile change does to Edges."
